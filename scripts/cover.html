<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<!-- The itch.io cover, 630 × 500, rendered by render-cover.sh: the title over the felt, caught mid-trick. The middle row
     is on its way back, half a card along: its King, leaving at the right, comes round at the left (the wrap copy, as
     the board draws it), and the card it was taken by is lifted with its gold ring over the dashed frame of where it
     started. The board is valid once the row is home (the rank gap, ok in logic.js), so the picture plays fair. -->
<style>
	@font-face {
		font-family: LM;
		src: url('../src/lib/fonts/Limelight.woff2');
	}

	@font-face {
		font-family: CG;
		font-weight: 500;
		font-style: italic;
		src: url('../src/lib/fonts/Cormorant Garamond Medium Italic.woff2');
	}

	html,
	body {
		margin: 0;
		background: #0d0306;
	}

	/* the game's page: velvet, lit from the upper left, in its double gold frame */
	.cover {
		position: relative;
		width: 630px;
		height: 500px;
		overflow: hidden;
		background: radial-gradient(ellipse at 30% 0%, #5a1626 0%, #2b0b13 58%, #17050a 100%);
	}

	/* a spotlight on the felt, as on a stage */
	.cover::before {
		content: '';
		position: absolute;
		inset: 0;
		background: radial-gradient(ellipse 46% 50% at 50% 66%, rgba(255, 214, 150, 0.1), transparent 70%);
	}

	.border {
		position: absolute;
		z-index: 2;
		border: 1px solid rgba(216, 180, 100, 0.6);
	}

	.outer {
		inset: 6px;
	}

	.inner {
		inset: 10px;
		border-color: rgba(216, 180, 100, 0.3);
	}

	.titles {
		position: absolute;
		top: 28px;
		left: 0;
		right: 0;
		display: grid;
		justify-items: center;
		gap: 4px;
	}

	h1 {
		margin: 0;
		font-family: LM;
		font-weight: 400;
		font-size: 76px;
		line-height: 1;
		color: #e6c677;
		text-shadow:
			0 3px 0 #3a0d16,
			0 0 30px rgba(216, 180, 100, 0.3);
	}

	/* off by a little, as on Home */
	.by {
		display: inline-block;
		font-size: 50px;
		transform: translateY(10px);
	}

	.tagline {
		font-family: CG;
		font-style: italic;
		font-weight: 500;
		font-size: 27px;
		color: #d8b464;
	}

	/* the felt, as the game's (#120609, one gold line, a little rounded), its cards clipped by it */
	.felt {
		position: absolute;
		overflow: hidden;
		background: #120609;
		border: 1px solid #d8b464;
		border-radius: 9px;
		box-shadow: 0 18px 36px rgba(0, 0, 0, 0.6);
	}

	.card,
	.home-frame {
		position: absolute;
		box-sizing: border-box;
	}

	.card {
		border-radius: 7px;
		background: #fffaf0;
		box-shadow: 0 3px 6px rgba(0, 0, 0, 0.55);
	}

	.card img {
		display: block;
		width: 100%;
		height: 100%;
	}

	/* the moving lane, and its anchor lifted (the board's LIFT, 4%), above its neighbours */
	.card.moving {
		box-shadow:
			0 0 16px rgba(216, 180, 100, 0.45),
			0 10px 18px rgba(0, 0, 0, 0.7);
	}

	.card.anchor {
		z-index: 1;
		transform: scale(1.04);
		box-shadow:
			0 0 0 3px #d8b464,
			0 0 18px 4px rgba(216, 180, 100, 0.5),
			0 12px 22px rgba(0, 0, 0, 0.75);
	}

	.home-frame {
		z-index: 2;
		border: 2px dashed rgba(230, 198, 119, 0.75);
		border-radius: 7px;
	}
</style>
</head>
<body>
<div class="cover">
	<div class="border outer"></div>
	<div class="border inner"></div>
	<div class="titles">
		<h1>Off <span class="by">by</span> One</h1>
		<div class="tagline">Just a slide of hand.</div>
	</div>
	<div class="felt" id="felt"></div>
</div>
<script>
	// the board once solved, rows from the top: each card as its file in src/lib/images/cards
	const SOLVED = [
		['SA', 'H9', 'CQ', 'D4', 'S7'],
		['DJ', 'C6', 'H2', 'S10', 'HK'],
		['C8', 'HQ', 'S5', 'D7', 'C3']
	];
	// the row that slipped, one to the right, and how far back it is: half a card to go
	const ROW = 1;
	const ALONG = 0.5;
	// the card it was taken by, in the solved row, and so its frame one place to the right, where it started
	const ANCHOR = 2;

	// the cards and the gap between them, a share of the pitch, as the game's CARD_RATIO and CARD_GAP
	const CW = 70;
	const CH = Math.round(CW / 0.72);
	const GAP = Math.round((CW * 0.07) / 0.93);
	const PAD = 6;
	const COLS = SOLVED[0].length;
	const ROWS = SOLVED.length;
	const PX = CW + GAP;
	const PY = CH + GAP;
	const W = COLS * PX - GAP + 2 * PAD;
	const H = ROWS * PY - GAP + 2 * PAD;
	const TOP = 152;

	const felt = document.getElementById('felt');
	Object.assign(felt.style, { width: `${W}px`, height: `${H}px`, left: `${(630 - W) / 2 - 1}px`, top: `${TOP}px` });

	const place = (el, col, row) => {
		Object.assign(el.style, { left: `${PAD + col * PX}px`, top: `${PAD + row * PY}px`, width: `${CW}px`, height: `${CH}px` });
		felt.appendChild(el);
	};

	const card = (file, col, row, ...classes) => {
		const el = document.createElement('div');
		el.className = ['card', ...classes].join(' ');
		el.innerHTML = `<img src="../src/lib/images/cards/${file}.svg" alt="">`;
		place(el, col, row);
	};

	SOLVED.forEach((cards, r) => {
		if (r !== ROW) cards.forEach((file, c) => card(file, c, r));
	});

	const frame = document.createElement('div');
	frame.className = 'home-frame';
	place(frame, ANCHOR + 1, ROW);

	SOLVED[ROW].forEach((file, c) => {
		card(file, c + ALONG, ROW, 'moving', c === ANCHOR ? 'anchor' : '');

		// the last card, leaving at the right, comes round at the left too
		if (c === COLS - 1) card(file, ALONG - 1, ROW, 'moving');
	});
</script>
</body>
</html>
