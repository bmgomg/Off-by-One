<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile</title>
<!-- The itch.io page background, a seamless tile, 1024 × 1024, rendered by render-cover.sh: a stage curtain in the game's
     velvet. Its folds are waves a whole number of times across the tile, bent by others that are too, so they meet
     themselves at the edges; its nap is fractal noise on lattices that wrap, long and thin like the pile's sheen. It
     doesn't change from top to bottom, so it repeats down the page unseen. Dim, so the page's column stays the thing
     to read. -->
<style>
	html,
	body {
		margin: 0;
		background: #2b0b13;
	}

	canvas {
		display: block;
	}
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
	const S = 1024;
	// the game's velvet: in a fold's shadow, on its crest
	const LOW = [23, 5, 10];
	const HIGH = [74, 19, 33];
	// the folds: deep ones, and shallow ones over them, each as how many across the tile, its share of the light, and
	// the waves (cycles across the tile, size, phase) that make them uneven
	const FOLDS = [
		{ n: 5, share: 0.7, bends: [[1, 1.2, 0.3], [2, 0.7, 2.1], [3, 0.4, 4.0]] },
		{ n: 13, share: 0.3, bends: [[1, 2.0, 1.7], [3, 0.9, 5.2], [4, 0.5, 0.6]] }
	];
	// a crest's sharpness: higher, narrower crests and wider shadows
	const SHEEN = 1.4;
	// the nap: lattices as [across, down], coarsest first, halving the weight each time, and how much it shows
	const NAP = [
		[16, 2],
		[64, 4],
		[256, 8],
		[512, 16]
	];
	const NAP_STRENGTH = 0.3;
	// a little noise, in levels of 255, against the bands that gradients this dark show
	const DITHER = 1.2;

	const rand = (() => {
		let a = 20261110;
		return () => {
			a = (a + 0x6d2b79f5) | 0;
			let t = Math.imul(a ^ (a >>> 15), 1 | a);
			t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
			return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
		};
	})();

	const smooth = (t) => t * t * (3 - 2 * t);

	// fractal noise, 0 to 1, that wraps: each lattice's far edge reads its first row and column again
	const lattices = NAP.map(([nx, ny]) => ({ nx, ny, values: Float32Array.from({ length: nx * ny }, rand) }));
	const total = NAP.reduce((sum, _, i) => sum + 0.5 ** i, 0);

	const nap = (x, y) => {
		let sum = 0;

		lattices.forEach(({ nx, ny, values }, i) => {
			const u = (x / S) * nx;
			const v = (y / S) * ny;
			const x0 = Math.floor(u);
			const y0 = Math.floor(v);
			const x1 = (x0 + 1) % nx;
			const y1 = (y0 + 1) % ny;
			const fx = smooth(u - x0);
			const fy = smooth(v - y0);
			const top = values[y0 * nx + x0] * (1 - fx) + values[y0 * nx + x1] * fx;
			const bottom = values[y1 * nx + x0] * (1 - fx) + values[y1 * nx + x1] * fx;

			sum += (top * (1 - fy) + bottom * fy) * 0.5 ** i;
		});

		return sum / total;
	};

	// how lit the curtain is at x, 0 to 1
	const fold = (x) => {
		const t = (2 * Math.PI * x) / S;

		return FOLDS.reduce((light, { n, share, bends }) => {
			const phase = n * t + bends.reduce((sum, [k, size, at]) => sum + size * Math.sin(k * t + at), 0);

			return light + share * ((1 + Math.cos(phase)) / 2) ** SHEEN;
		}, 0);
	};

	const ctx = document.getElementById('c').getContext('2d');
	const image = ctx.createImageData(S, S);
	const lit = Float32Array.from({ length: S }, (_, x) => fold(x));

	for (let y = 0; y < S; y++) {
		for (let x = 0; x < S; x++) {
			const i = (y * S + x) * 4;
			const light = Math.min(1, Math.max(0, lit[x] * (1 + NAP_STRENGTH * (2 * nap(x, y) - 1))));
			const dither = (rand() + rand() - 1) * DITHER;

			for (let c = 0; c < 3; c++) {
				image.data[i + c] = LOW[c] + (HIGH[c] - LOW[c]) * light + dither;
			}

			image.data[i + 3] = 255;
		}
	}

	ctx.putImageData(image, 0, 0);
</script>
</body>
</html>
