<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rules</title>
<!-- The rules graphic for the itch.io page, 900 × 600, in the format of Dark Matter's and Hexodus's, rendered by
     render-cover.sh. Its wording states the rule (RULE_TEXT, ok in logic.js), the score (points), and the strikes
     (MAX_STRIKES): change them with the game. -->
<style>
	@font-face {
		font-family: LM;
		src: url('../src/lib/fonts/Limelight.woff2');
	}

	@font-face {
		font-family: CG;
		font-weight: 500;
		src: url('../src/lib/fonts/Cormorant Garamond Medium.woff2');
	}

	@font-face {
		font-family: CG;
		font-weight: 500;
		font-style: italic;
		src: url('../src/lib/fonts/Cormorant Garamond Medium Italic.woff2');
	}

	html,
	body {
		margin: 0;
		background: #0d0306;
	}

	/* the game's page: velvet, lit from the upper left, in its double gold frame */
	.card {
		position: relative;
		width: 900px;
		height: 600px;
		overflow: hidden;
		background: radial-gradient(ellipse at 30% 0%, #5a1626 0%, #2b0b13 58%, #17050a 100%);
		font-family: CG;
		font-weight: 500;
		color: #eadfc6;
	}

	.border {
		position: absolute;
		border: 1px solid rgba(216, 180, 100, 0.6);
	}

	.outer {
		inset: 8px;
	}

	.inner {
		inset: 13px;
		border-color: rgba(216, 180, 100, 0.3);
	}

	.text {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 34px;
	}

	.headline {
		font-size: 44px;
		line-height: 1.3;
		text-align: center;
		color: #f4ead5;
	}

	/* Home's divider: a gold line with a diamond */
	.divider {
		display: flex;
		align-items: center;
		gap: 12px;
		width: 380px;
	}

	.divider span {
		flex: 1;
		height: 1px;
		background: rgba(216, 180, 100, 0.6);
	}

	.divider i {
		width: 9px;
		height: 9px;
		background: #d8b464;
		transform: rotate(45deg);
	}

	.terms {
		display: grid;
		grid-template-columns: auto auto;
		justify-content: center;
		align-items: baseline;
		column-gap: 34px;
		row-gap: 20px;
		font-size: 33px;
	}

	.term {
		font-family: LM;
		font-size: 30px;
		color: #e6c677;
		text-align: right;
		text-shadow:
			0 2px 0 #3a0d16,
			0 0 16px rgba(216, 180, 100, 0.3);
	}

	.closing {
		font-style: italic;
		font-size: 36px;
		color: #d8b464;
	}
</style>
</head>
<body>
<div class="card">
	<div class="border outer"></div>
	<div class="border inner"></div>
	<div class="text">
		<div class="headline">
			<div>One row or column has slipped.</div>
			<div>Slide it back, in one shift.</div>
		</div>
		<div class="divider"><span></span><i></i><span></span></div>
		<div class="terms">
			<div class="term">Wrap</div>
			<div>A card off one end comes round at the other.</div>
			<div class="term">Rank</div>
			<div>Touching cards differ by two or more.</div>
			<div class="term">Clock</div>
			<div>Score the seconds left, times the act.</div>
		</div>
		<div class="divider"><span></span><i></i><span></span></div>
		<div class="closing">Three strikes, and the curtain falls.</div>
	</div>
</div>
</body>
</html>
